# Alembic Configuration for MineOpt Pro
# =========================================
# This file is read by Alembic to configure migration behavior.
# The sqlalchemy.url can be overridden by the DATABASE_URL env var
# in migrations/env.py for production deployments.

[alembic]
# Path to migration scripts directory
script_location = migrations

# Template used to generate migration scripts
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
file_template = %%(rev)s_%%(slug)s

# Truncate slug to this many characters (default: 40)
truncate_slug_length = 40

# Set to 'true' to run environment-specific offline migrations
# with ALTER statements rendered as SQL
# output_encoding = utf-8

# SQLAlchemy connection URL (dev default: SQLite)
# For production, set DATABASE_URL environment variable instead.
sqlalchemy.url = sqlite:///%(here)s/mineopt_pro.db

# Logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
